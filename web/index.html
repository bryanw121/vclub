<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: extend layout into notch/Dynamic Island/home-indicator -->
    <!-- interactive-widget=resizes-content: on Chrome/Android, shrink the visual
         viewport (and therefore position:fixed elements) when the soft keyboard opens,
         so the chat input bar rises above the keyboard automatically. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Dark mode browser chrome -->
    <meta name="color-scheme" content="dark" />
    <!-- PWA / home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#13111F" />
    <title>vclub</title>
    <style id="expo-reset">
      html {
        /*
         * 100dvh = dynamic viewport height: shrinks when the URL bar is visible,
         * grows when it collapses. This lets Safari/Chrome collapse the bar on
         * scroll since the root is no longer pinned with position:fixed.
         */
        height: 100dvh;
        overflow: hidden;
      }
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #13111F;
        overflow: hidden;
        overscroll-behavior-y: none;
      }
      #root {
        height: 100%;
        display: flex;
        overflow: hidden;
      }
      /* Expo injects a wrapper div inside #root that must also stretch full height */
      #root > div {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
