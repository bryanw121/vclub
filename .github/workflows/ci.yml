name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    # The e2e suites write to the single shared Supabase project (seed
    # conversation sends/edits, event join/leave). Concurrent runs interfere
    # through the DB and can exhaust connection limits — observed when three
    # back-to-back merges spawned three parallel suites and one drowned in
    # genuine fetch failures. Serialize e2e across ALL branches/PRs. A pending
    # run superseded by a newer one shows as cancelled — rerun it manually if
    # its PR still needs the check (rare at this team size).
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build:web
      - name: Serve + run Playwright
        run: |
          npx serve dist -p 8081 &
          sleep 3
          npx playwright test e2e/
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
