name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR: a newer push cancels the older run of the same ref.
# Runs of different PRs proceed in parallel (e2e data is namespaced per run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  docs:
    name: Architecture docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run docs:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests

  # The web build runs in parallel with docs/unit, outside the shared e2e lock,
  # so the serialized e2e job only installs and runs tests.
  build-web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  e2e-shard:
    name: E2E (${{ matrix.shard }})
    # PRs only: every e2e run signs in, writes fixtures and opens realtime
    # channels on the one shared Supabase project, and a merge to main is the
    # squash of a PR that already passed. Skipping the post-merge rerun halves
    # the load on the project's disk IO budget.
    if: github.event_name == 'pull_request'
    # One e2e suite at a time across ALL PRs: each shard of a run shares a
    # repo-wide group with the same shard of every other PR's run. Five PRs'
    # suites overlapping on 2026-10-25 exhausted the live project's disk IO and
    # made real sign-ins time out. GitHub keeps one pending job per group, so
    # with three or more PRs queued the middle one's shard is cancelled:
    # re-run it ("Re-run failed jobs") once the queue clears.
    concurrency:
      group: e2e-live-supabase-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-web]
    strategy:
      fail-fast: false
      matrix:
        # Split by spec file. Each shard signs in itself (auth.setup + auth.verify).
        include:
          - shard: chat
            specs: e2e/chat.spec.ts
          - shard: events
            specs: e2e/events.spec.ts
          - shard: other
            specs: e2e/guest.spec.ts e2e/tour.guest.spec.ts e2e/profile.spec.ts e2e/book.guest.spec.ts e2e/book.spec.ts
    # Credentials of the dedicated e2e account (repository secrets). Required:
    # e2e/env.ts fails fast with a clear message when they are missing, which is
    # also what happens on PRs from forks (secrets are not exposed to them).
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Namespaces the rows this run creates ("[e2e r<run>-<attempt>] ..."), so
      # parallel runs against the shared Supabase project never touch, match or
      # sweep each other's fixtures. Read only via e2e/env.ts.
      E2E_RUN_TAG: r${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Serve + run Playwright
        run: |
          npx serve dist -p 8081 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8081/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::static server did not answer on :8081 within 30s"
            exit 1
          fi
          npx playwright test e2e/auth.setup.ts e2e/auth.verify.ts ${{ matrix.specs }}
      - name: Sweep this run's [e2e] events
        # A cancelled or crashed run skips the suite's afterAll cleanup. Never
        # let a failed sweep turn a green run red (or hide the real failure).
        if: always() && matrix.shard == 'events'
        continue-on-error: true
        run: npm run e2e:sweep
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Branch protection requires a check named "Playwright E2E": this job reports
  # the combined result of the shards under that name.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::e2e shards: ${{ needs.e2e-shard.result }}"
            exit 1
          fi
