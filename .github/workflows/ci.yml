name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  docs:
    name: Architecture docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run docs:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docs, unit]
    # Credentials of the dedicated e2e account (repository secrets). Required:
    # e2e/env.ts fails fast with a clear message when they are missing, which is
    # also what happens on PRs from forks (secrets are not exposed to them).
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    # The e2e suites write to the single shared Supabase project (seed
    # conversation sends/edits, event join/leave). Concurrent runs interfere
    # through the DB and can exhaust connection limits — observed when three
    # back-to-back merges spawned three parallel suites and one drowned in
    # genuine fetch failures. Serialize e2e across ALL branches/PRs. A pending
    # run superseded by a newer one shows as cancelled — rerun it manually if
    # its PR still needs the check (rare at this team size).
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build:web
      - name: Serve + run Playwright
        run: |
          npx serve dist -p 8081 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8081/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::static server did not answer on :8081 within 30s"
            exit 1
          fi
          npx playwright test e2e/
      - name: Sweep leftover [e2e] events
        # A cancelled or crashed run skips the suite's afterAll cleanup. Never
        # let a failed sweep turn a green run red (or hide the real failure).
        if: always()
        continue-on-error: true
        run: npm run e2e:sweep
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
