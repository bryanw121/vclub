name: Mobile browsers

# Real phone browsers, which the PR e2e (desktop Chromium emulating a phone)
# cannot reproduce: Chrome for Android on an emulator and Mobile Safari on the
# iOS Simulator, each driven with real touches. Today it covers pull-to-refresh
# (#35). Nightly, on demand, and on PRs that touch the gesture code.
#
# Runs on GitHub-hosted VMs (ubuntu for Android, macOS for iOS) against the
# "vteam beta" database, as guest reads only.

on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC, nightly
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - components/RefreshControl*.tsx
      - components/DocScrollView.tsx
      - lib/pullGesture.ts
      - e2e/mobile/**
      - .github/workflows/mobile-browsers.yml

concurrency:
  group: mobile-browsers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://uifolvbwtrbcmfrvelnl.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZm9sdmJ3dHJiY21mcnZlbG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTY2OTUsImV4cCI6MjEwODUzMjY5NX0.8CcvfSOI3LNZ8KQ9OadOyN2dVy8lYiBeSVFzfC5ihh8

jobs:
  build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-mobile
          path: dist/
          retention-days: 3

  android:
    name: Chrome on Android (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-mobile
          path: dist/
      - name: Serve the build
        run: |
          npx serve dist -p 8081 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8081/ && exit 0; sleep 1; done
          echo "::error::static server did not answer on :8081"; exit 1
      - name: Playwright Android driver
        # device.input.swipe goes through a small driver APK Playwright installs on the device.
        run: npx playwright install android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pull-to-refresh on real Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # One line: the action runs each script line in its own shell.
          script: adb shell pm list packages | grep -i chrome && adb reverse tcp:8081 tcp:8081 && node e2e/mobile/android-pull.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android
          path: test-results/mobile/
          retention-days: 7

  ios:
    name: Safari on iOS (simulator)
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-mobile
          path: dist/
      - name: Serve the build
        run: |
          npx serve dist -p 8081 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8081/ && exit 0; sleep 1; done
          echo "::error::static server did not answer on :8081"; exit 1
      - name: Pick and boot an iPhone simulator
        id: sim
        run: |
          # Preinstalled simulator UUIDs change between runner images, so pick by name.
          IFS=$'\t' read -r udid name version < <(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0)).devices
            const all = Object.entries(d).filter(([rt]) => rt.includes("iOS"))
              .flatMap(([rt, list]) => list.map(x => ({ ...x, v: rt.split("iOS-").pop().replace(/-/g, ".") })))
              .filter(x => /^iPhone \d+$/.test(x.name))
              .sort((a, b) => parseFloat(b.v) - parseFloat(a.v))
            if (!all.length) process.exit(1)
            console.log([all[0].udid, all[0].name, all[0].v].join("\t"))')
          echo "Using $name (iOS $version) $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "device=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium@3
          appium driver install xcuitest
          npm install --no-save webdriverio@9
      - name: Prebuild WebDriverAgent
        # Building WDA inside the first session takes minutes; do it up front.
        continue-on-error: true
        run: appium driver run xcuitest build-wda
      - name: Pull-to-refresh on real Mobile Safari
        env:
          IOS_DEVICE: ${{ steps.sim.outputs.device }}
          IOS_VERSION: ${{ steps.sim.outputs.version }}
          IOS_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          appium --log appium.log &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 1; done
          node e2e/mobile/ios-pull.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios
          path: |
            test-results/mobile/
            appium.log
          retention-days: 7
