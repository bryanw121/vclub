# Config for GitHub's auto-generated release notes ("Generate release notes"
# button / `gh release create --generate-notes`). Groups merged PRs by label.
# Label your PRs (see CONTRIBUTING.md) or they land in "Other changes".
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ✨ Features
      labels: [enhancement]
    - title: ⚡ Performance
      labels: [performance]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 🔒 Security
      labels: [security]
    - title: 🧪 Tests & CI
      labels: [test, ci]
    - title: 📚 Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
